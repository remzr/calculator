<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Calcudex 1.0</h1>    
    <section id="display-section" class="sections">
        <div id="display">4 + 120</div>
    </section>
<div id="interface-container">
    <section id="number-section" class="sections">
        <button id="button-1" class="input-button" value="1">1</button>
        <button id="button-2" class="input-button" value="2">2</button>
        <button id="button-3" class="input-button" value="3">3</button>
        <button id="button-4" class="input-button" value="4">4</button>
        <button id="button-5" class="input-button" value="5">5</button>
        <button id="button-6" class="input-button" value="6">6</button>
        <button id="button-7" class="input-button" value="7">7</button>
        <button id="button-8" class="input-button" value="8">8</button>
        <button id="button-9" class="input-button" value="9">9</button>
        <button id="button-0" class="input-button" value="0">0</button>
        <button id="button-clear" class="operator-button">clear</button>
        <button id="button-add" class="input-button operator-button" value="+">+</button>
        <button id="button-subtract" class="input-button operator-button" value="-">-</button>
        <button id="button-multiply" class="input-button operator-button" value="*">*</button>
        <button id="button-divide" class="input-button operator-button" value="/">/</button>
    </section>
</div>
    <button id="button-equal">Calculate!</button>    
</main>
    <script src="calculator.js"></script>    
</body>
</html>
