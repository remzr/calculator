<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Calcudex 1.0</h1>    
    <section id="display-section" class="sections">
        <div id="display">4 + 120</div>
    </section>
<div id="interface-container">
    <section id="number-section" class="sections">
        <button id="button-1">1</button>
        <button id="button-2">2</button>
        <button id="button-3">3</button>
        <button id="button-4">4</button>
        <button id="button-5">5</button>
        <button id="button-6">6</button>
        <button id="button-7">7</button>
        <button id="button-8">8</button>
        <button id="button-9">9</button>
        <button id="button-0">0</button>
        <button id="button-clear" class="operator-button">clear</button>
        <button id="button-add" class="operator-button">+</button>
        <button id="button-subtract" class="operator-button">-</button>
        <button id="button-multiply" class="operator-button">*</button>
        <button id="button-divide" class="operator-button">/</button>
    </section>
</div>
    <button id="button-equal">Calculate!</button>    
</main>
    <script src="calculator.js"></script>    
</body>
</html>
